# Render Blueprint: https://render.com/docs/blueprint-spec
# If Render adds a suffix to a service name (name already taken), update the URLs below to match.

services:
  - type: web
    name: boxing-tracker-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string; Render prompts for it on first Blueprint apply
      - key: ORIGIN
        value: https://boxing-tracker-client-b2wn.onrender.com

  - type: web
    name: boxing-tracker-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://boxing-tracker-api.onrender.com
