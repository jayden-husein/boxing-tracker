# Render Blueprint: https://render.com/docs/blueprint-spec
# If Render adds a suffix to a service name (name already taken), update the URLs below to match.

databases:
  - name: boxing-tracker-db
    databaseName: boxing_tracker
    plan: free

services:
  - type: web
    name: boxing-tracker-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boxing-tracker-db
          property: connectionString
      - key: ORIGIN
        value: https://boxing-tracker-client.onrender.com

  - type: web
    name: boxing-tracker-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://boxing-tracker-api.onrender.com
